  Two procedures were submitted for consideration. The first, billed under
  CPT 99212, was a brief office visit for an established patient. The second,
  CPT 94640, was a nebulizer treatment administered during the same encounter.
  Taken together, the provider billed a total of $165.00 for this encounter.

  After applying your plan's negotiated rates and benefit provisions, we have
  paid the provider $132.00 directly. The remaining balance of $33.00 is your
  responsibility and may be billed to you separately by the provider's office.

  This notice is furnished for informational purposes and is not itself a bill.
