# Nightly live run. Catches provider-side drift the committed cache cannot:
# a silently updated model, a changed default, a quietly altered tokenizer.
#
# It opens an issue rather than blocking anything, because a scheduled job
# failing on a provider hiccup should not gate anyone's merge.
name: eval-nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Overlapping nightly runs would double the spend, so never run two at once
# and never cancel one midway through paid calls.
concurrency:
  group: eval-nightly
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # A hard ceiling independent of the harness's own limits, as a safety
      # net against a retry loop turning into a bill.
      MAX_API_CALLS: "200"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .[dev]

      - name: Live evaluation
        id: live
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/ci_eval.py \
            --live \
            --explain \
            --db "$RUNNER_TEMP/nightly.db" \
            --markdown "$RUNNER_TEMP/gates.md"

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.RUNNER_TEMP}/gates.md`;
            const table = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : '_No gate table was produced; the run failed before evaluation._';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly eval failed — ${new Date().toISOString().slice(0, 10)}`,
              labels: ['eval'],
              body: [
                'The nightly live evaluation failed.',
                '',
                'The pull-request gate runs against committed responses, so a',
                'failure here that does not reproduce there points at',
                'provider-side drift rather than a change in this repository.',
                '',
                table,
                '',
                `[Run log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              ].join('\n'),
            });
