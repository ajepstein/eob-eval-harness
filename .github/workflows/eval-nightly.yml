# Nightly live run. Catches provider-side drift the committed cache cannot:
# a silently updated model, a changed default, a quietly altered tokenizer.
#
# It opens an issue rather than blocking anything, because a scheduled job
# failing on a provider hiccup should not gate anyone's merge.
name: eval-nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Overlapping nightly runs would double the spend, so never run two at once
# and never cancel one midway through paid calls.
concurrency:
  group: eval-nightly
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # A hard ceiling independent of the harness's own limits, as a safety
      # net against a retry loop turning into a bill.
      MAX_API_CALLS: "200"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .[dev]

      # A missing secret is a configuration gap, not a finding. Without this
      # the job fails inside adapter construction — get_api_key() runs in
      # AnthropicAdapter.__init__, so there is no way to ask "are we ready?"
      # without already having thrown. Checked here, before anything is
      # loaded and before the cost estimate is printed.
      - name: Check credentials
        id: preflight
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          missing=""
          [ -n "$ANTHROPIC_API_KEY" ] || missing="$missing ANTHROPIC_API_KEY"
          [ -n "$OPENAI_API_KEY" ] || missing="$missing OPENAI_API_KEY"
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=Nightly eval skipped::Not configured — missing secret(s):$missing"
          {
            echo "### Nightly eval skipped — not configured"
            echo
            echo "Missing repository secret(s):"
            for name in $missing; do echo "- \`$name\`"; done
            echo
            echo "Set them under **Settings → Secrets and variables → Actions**."
            echo "Nothing was evaluated and no API calls were made, so this run"
            echo "says nothing about the models or the harness."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Live evaluation
        id: live
        if: steps.preflight.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # pipefail so tee does not mask a non-zero exit from the eval.
          set -o pipefail
          python scripts/ci_eval.py \
            --live \
            --explain \
            --db "$RUNNER_TEMP/nightly.db" \
            --markdown "$RUNNER_TEMP/gates.md" \
            2>&1 | tee "$RUNNER_TEMP/live.log"

      # Only for a run that actually evaluated something. A skipped run has
      # nothing to report and must not file anything.
      - name: Report failure
        if: failure() && steps.preflight.outputs.ready == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p, fallback) =>
              fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : fallback;

            const table = read(
              `${process.env.RUNNER_TEMP}/gates.md`,
              '_No gate table was produced; the run failed before evaluation._',
            );
            // The last lines carry the actual error. Without them the issue
            // can only guess at a cause, which is how fifteen issues came to
            // assert provider drift for a missing secret.
            const log = read(`${process.env.RUNNER_TEMP}/live.log`, '');
            const tail = log.trim().split('\n').slice(-25).join('\n');

            const runUrl = `${context.serverUrl}/${context.repo.owner}/`
              + `${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The nightly live evaluation failed.',
              '',
              'The pull-request gate runs against committed responses. If this',
              'failure does not reproduce there, the cause is outside this',
              'repository — provider drift, an API change, or credentials.',
              'The output below says which.',
              '',
              tail ? '```\n' + tail + '\n```' : '_No output was captured._',
              '',
              table,
              '',
              `[Run log](${runUrl})`,
            ].join('\n');

            // One issue per recurring failure, not one per night.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'eval',
              state: 'open',
              per_page: 1,
            });

            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Failed again on ${new Date().toISOString().slice(0, 10)}.\n\n${body}`,
              });
              core.notice(`Commented on existing issue #${open[0].number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Nightly eval failing — since ${new Date().toISOString().slice(0, 10)}`,
                labels: ['eval'],
                body,
              });
              core.notice(`Opened issue #${created.number}`);
            }
