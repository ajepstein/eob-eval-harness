[project]
name = "eval-harness"
version = "0.1.0"
description = "Provider-agnostic evaluation harness for LLM document extraction"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "python-dotenv>=1",
    "anthropic>=0.40",
    "openai>=1.50",
    "tenacity>=8",
    "rich>=13",
    "jinja2>=3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires network access and a real provider API key; skipped by default",
]
addopts = "-m 'not live'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]
